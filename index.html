<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CasCas · KL East</title>
  <meta name="description" content="Shared EV charging for SDP townships: battery-aware routing, idle-hour condo sharing and JMB income.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      <div><b data-app-name>CasCas</b><small data-tagline></small></div>
    </div>
    <nav class="roles" aria-label="Choose a view">
      <a href="#driver" data-role="driver"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11zm0-8.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg><span>Driver</span></a>
      <a href="#jmb" data-role="jmb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14M9 21v-5h6v5M8 10h2M14 10h2M8 13h2M14 13h2"/></svg><span>JMB</span></a>
    </nav>
    <p id="data-source" class="source" aria-live="polite">Chargers: loading…</p>
    <p id="data-mode" class="source"></p>
    <div class="clock">
      <label for="clock-preset">Demo time</label>
      <select id="clock-preset"></select>
      <input id="clock-custom" type="datetime-local" hidden aria-label="Custom demo time">
    </div>
  </header>
  <main id="view"></main>
  <footer class="foot">
    <span>Prototype for the Sime Darby Property University Hackathon 2026. Condo bays, occupancy and history are simulated; condo names are fictional.</span>
    <button id="reset" class="btn small" type="button">Reset demo</button>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
