<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CasCas · KL East</title>
  <meta name="description" content="Shared EV charging for SDP townships: battery-aware routing, idle-hour condo sharing and JMB income.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      <div><b data-app-name>CasCas</b><small data-tagline></small></div>
    </div>
    <nav class="roles" aria-label="Main">
      <a href="#home" data-role="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></a>
      <a href="#map" data-role="map"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Map</span></a>
      <a href="#plan" data-role="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 17h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg><span>Plan</span></a>
      <a href="#activity" data-role="activity"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/></svg><span>Activity</span></a>
      <a href="#account" data-role="account"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg><span>Account</span></a>
    </nav>
    <p id="data-source" class="source" aria-live="polite">Chargers: loading…</p>
    <p id="data-mode" class="source"></p>
    <div class="clock">
      <label for="clock-preset">Demo time</label>
      <select id="clock-preset"></select>
      <input id="clock-custom" type="datetime-local" hidden aria-label="Custom demo time">
    </div>
  </header>
  <main id="view"></main>
  <footer class="foot">
    <span>Prototype for the Sime Darby Property University Hackathon 2026. Condo bays, occupancy and history are simulated; condo names are fictional.</span>
    <button id="reset" class="btn small" type="button">Reset demo</button>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
