<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CasCas for JMBs</title>
  <meta name="description" content="CasCas JMB portal: shared charging income, cost recovery, live chargers, maintenance and visitor access for condo management.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-app="jmb" class="portal-page">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      <div><b><span data-app-name>CasCas</span> <span class="portal-tag">JMB portal</span></b><small>Condo management · charging income and operations</small></div>
    </div>
    <a class="btn small switch" href="./">Open the driver app</a>
    <p id="data-source" class="source" aria-live="polite">Chargers: loading…</p>
    <p id="data-mode" class="source"></p>
    <div class="clock">
      <label for="clock-preset">Demo time</label>
      <select id="clock-preset"></select>
      <input id="clock-custom" type="datetime-local" hidden aria-label="Custom demo time">
    </div>
  </header>
  <main id="view"></main>
  <footer class="foot">
    <span>Prototype for the Sime Darby Property University Hackathon 2026. Condo bays, occupancy and history are simulated; condo names are fictional.</span>
    <button id="reset" class="btn small" type="button">Reset demo</button>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
